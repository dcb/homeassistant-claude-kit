- id: '1729625760342'
  alias: Plate Detection
  description: ''
  enabled: false
  triggers:
  - type: turned_on
    device_id: 15d64d59beeda98905c32f042cb082f4
    entity_id: 07c73b37daeb564ed86576ab6832e678
    domain: binary_sensor
    trigger: device
    for:
      hours: 0
      minutes: 0
      seconds: 2
  conditions: []
  actions:
  - action: image_processing.scan
    target:
      entity_id: image_processing.platerecognizer_garage_outside_medium_resolution_channel
    data: {}
  - variables:
      text_message: "{% if is_state(\"sensor.plate_recognizer_bmw\", \"True\") -%}\n
        \ The BMW just got home.\n{%- elif is_state(\"sensor.plate_recognizer_tesla\",
        \"True\") -%}\n  Obelix just got home.\n{%- elif is_state(\"sensor.plate_recognizer_asterix\",
        \"True\") -%}\n  Asterix just got home.\n{%- else -%}\n  Unknown vehicle(s)
        in the driveway.\n  {% for state in state_attr('image_processing.platerecognizer_garage_outside_medium_resolution_channel',
        'vehicles') -%}\n    {%- if loop.first %}The first vehicle is a {% elif loop.last
        %} and last one is a {% else %}, the next one is a {% endif -%}\n    [{{ state.vehicle_type
        | lower }}], with plate [{{ state.region_code }} {{ state.plate }}]. Confidence
        [{{ state.confidence }}].\n  {%- endfor %}\n  {% set stats = state_attr('image_processing.platerecognizer_garage_outside_medium_resolution_channel',
        'statistics') %}\n  Remaining calls [{{ stats.calls_remaining }}] | Calls
        this period [{{ stats.usage.calls }}]\n  Resets on  [{{ (stats.usage.resets_on
        | as_datetime | as_local).strftime('%Y-%m-%d') }}]\n{%- endif %} "
  - action: notify.mobile_app_horis_iphone
    metadata: {}
    data:
      title: Vehicle(s) in driveway
      message: '{{ text_message }}'
  - action: notify.persistent_notification
    metadata: {}
    data:
      message: '{{ text_message }}'
    enabled: true
  mode: single
