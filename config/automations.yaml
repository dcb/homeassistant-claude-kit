  description: ''
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.grid_status
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 30
  condition:
  - condition: state
    entity_id: climate.downstairs
    state: cooling
    for:
      hours: 0
      minutes: 0
      seconds: 0
    attribute: hvac_action
  - condition: or
    conditions:
    - condition: state
      entity_id: climate.family_room
      state: cooling
      attribute: hvac_action
  - condition: or
    conditions:
    - condition: state
      entity_id: climate.master_bedroom
      state: cooling
      attribute: hvac_action
  action:
  - service: climate.set_hvac_mode
    target:
      entity_id: climate.downstairs
    data:
      hvac_mode: 'off'
  - service: climate.set_hvac_mode
    data:
      hvac_mode: 'off'
    target:
      entity_id: climate.family_room
  - service: climate.set_hvac_mode
    data:
      hvac_mode: 'off'
    target:
      entity_id: climate.master_bedroom
  mode: single
