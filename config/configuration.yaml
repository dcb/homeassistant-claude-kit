# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Activate the configuration editor
config:

# Example configuration.yaml
homeassistant:
  media_dirs:
    media: /media

# Uncomment this if you are using SSL/TLS, running in Docker container, etc.
#http:
#    ssl_certificate: /ssl/fullchain.pem
#    ssl_key: /ssl/privkey.pem

automation: !include automations.yaml
script: !include scripts.yaml

alexa:
  smart_home:

frontend:

shell_command:
  disco_off: echo -e -n "\x01\x08\x00\xF2\x51\x01\x00\x05\x01\x51" > /dev/serial/by-id/usb-0658_0200-if00
  disco_on: echo -e -n "\x01\x08\x00\xF2\x51\x01\x01\x05\x01\x50" > /dev/serial/by-id/usb-0658_0200-if00
  delete_old_www_picture: 'find /config/www/picture -type f -exec /bin/rm -f {} \;'
  delete_old_www_plates: 'find /config/www/plates -type f -exec /bin/rm -f {} \;'
  delete_old_tts: 'find /config/tts -type f -exec /bin/rm -f {} \;'

notify:
  - name: WhatsApp
    platform: rest
    resource: https://api.callmebot.com/whatsapp.php
    data:
      source: HA
      phone: +17742625384 #enter your phone number here
      apikey: 608924 #enter your apikey here (see Setup above)
#  - name: ALL_DEVICES
#    platform: group
#    services:
#      - action: mobile_app_horis_iphone

image_processing:
  - platform: platerecognizer
    api_token: 70178e964ba56353bfd5ce30f4459035988c69c9
    regions:
      - us
    watched_plates:
      - 683rs5
      - 4bw614
      - vead96
    save_file_folder: /config/www/plates
    save_timestamped_file: True
    always_save_latest_file: True
    #mmc: False
    #detection_rule: strict
    #region: strict
    source:
      - entity_id: camera.garage_outside_medium_resolution_channel
    
template:
  - sensor:
      - default_entity_id: sensor.counter_first_floor_lights
        name: Lower Level Lights ON
        state:
          "{{ states.light | selectattr('state', 'eq', 'on') | selectattr('entity_id',
          'in', label_entities('LIGHT')) | selectattr('entity_id', 'in', label_entities('FIRST_FLOOR'))
          | list | count }}"
  - sensor:
      - default_entity_id: sensor.counter_second_floor_lights
        name: Upper Level Lights ON
        state:
          "{{ states.light | selectattr('state', 'eq', 'on') | selectattr('entity_id',
          'in', label_entities('LIGHT')) | selectattr('entity_id', 'in', label_entities('SECOND_FLOOR'))
          | list | count }}"
  - sensor:
      - default_entity_id: sensor.counter_basement_lights
        name: Basement Lights ON
        state:
          "{{ states.light | selectattr('state', 'eq', 'on') | selectattr('entity_id',
          'in', label_entities('LIGHT')) | selectattr('entity_id', 'in', label_entities('BASEMENT'))
          | list | count }}"
  - sensor:
      - default_entity_id: sensor.counter_outside_lights
        name: Outside Lights ON
        state:
          "{{ states.light | selectattr('state', 'eq', 'on') | selectattr('entity_id',
          'in', label_entities('LIGHT')) | selectattr('entity_id', 'in', label_entities('OUTSIDE'))
          | list | count }}"
  - sensor:
      - default_entity_id: sensor.asterix_charge_limit_template
        name: Asterix Charge Limit - Template
        state: "{{ states('number.asterix_charge_limit') }}"
  - trigger:
    - trigger: time_pattern
      hours: /1
    - platform: homeassistant
      event: start
    - platform: event
      event_type: event_template_reloaded
    action:
      - action: weather.get_forecasts
        data:
          type: hourly
        target:
          entity_id: weather.dream_home
        response_variable: hourly_data
    sensor:
      - name: "Temp Max Next 12h"
        unique_id: temp_max_next_12h
        unit_of_measurement: "F"
        device_class: temperature
        state: >
          {% set forecasts = hourly_data['weather.dream_home'].forecast[:12] %}
          {{ forecasts | map(attribute='temperature') | list | max }}
      - name: "Temp Min Next 12h"
        unique_id: temp_min_next_12h
        unit_of_measurement: "F"
        device_class: temperature
        state: >
          {% set forecasts = hourly_data['weather.dream_home'].forecast[:12] %}
          {{ forecasts | map(attribute='temperature') | list | min }}

      - name: "Current Weather Condition"
        unique_id: current_weather_condition
        state: >
          {{ hourly_data['weather.dream_home'].forecast[0].condition }}

  - sensor:
      - name: "Zone Effective Target Downstairs"
        unique_id: zone_effective_target_downstairs
        unit_of_measurement: "°F"
        device_class: temperature
        state: >
          {% if is_state('input_boolean.zone_override_downstairs', 'on') %}
            {{ states('input_number.zone_target_downstairs') | float(70) }}
          {% else %}
            {{ state_attr('climate.downstairs', 'temperature') | default(70) }}
          {% endif %}

      - name: "Zone Effective Target Master Bed"
        unique_id: zone_effective_target_master
        unit_of_measurement: "°F"
        device_class: temperature
        state: >
          {% if is_state('input_boolean.zone_override_master', 'on') %}
            {{ states('input_number.zone_target_master') | float(70) }}
          {% else %}
            {{ state_attr('climate.master_bedroom', 'temperature') | default(70) }}
          {% endif %}

      - name: "Zone Effective Target Family Room"
        unique_id: zone_effective_target_family
        unit_of_measurement: "°F"
        device_class: temperature
        state: >
          {% if is_state('input_boolean.zone_override_family', 'on') %}
            {{ states('input_number.zone_target_family') | float(70) }}
          {% else %}
            {{ state_attr('climate.family_room', 'temperature') | default(70) }}
          {% endif %}

# ── Dashboard Input Helpers ──────────────────────────────────────────────────

input_boolean:
  night_mode:
    name: Night Mode
    icon: mdi:weather-night
  movie_mode:
    name: Movie Mode
    icon: mdi:movie
  work_mode:
    name: Work Mode
    icon: mdi:briefcase
  away_mode:
    name: Away Mode
    icon: mdi:home-export-outline
  night_alerts:
    name: Night Alerts
    icon: mdi:bell-sleep
  zone_override_downstairs:
    name: Zone Override Downstairs
    icon: mdi:thermostat
  zone_override_master:
    name: Zone Override Master Bed
    icon: mdi:thermostat
  zone_override_family:
    name: Zone Override Family Room
    icon: mdi:thermostat

input_select:
  climate_mode:
    name: Climate Mode
    options:
      - Heating
      - Cooling
      - "Off"
    initial: "Off"
    icon: mdi:hvac
  time_of_day:
    name: Time of Day
    options:
      - morning
      - day
      - evening
      - night
    initial: day
    icon: mdi:clock-time-four-outline

input_datetime:
  next_climate_transition:
    name: Next Climate Transition
    has_date: true
    has_time: true
    icon: mdi:calendar-clock

input_number:
  timeout_motion_normal:
    name: Motion Timeout Normal
    min: 10
    max: 600
    step: 10
    initial: 120
    unit_of_measurement: s
    icon: mdi:timer-outline
  timeout_motion_normal_long:
    name: Motion Timeout Normal (Long)
    min: 30
    max: 1800
    step: 30
    initial: 300
    unit_of_measurement: s
    icon: mdi:timer-outline
  timeout_motion_night:
    name: Motion Timeout Night
    min: 5
    max: 300
    step: 5
    initial: 30
    unit_of_measurement: s
    icon: mdi:timer-outline
  timeout_motion_night_short:
    name: Motion Timeout Night (Short)
    min: 5
    max: 120
    step: 5
    initial: 15
    unit_of_measurement: s
    icon: mdi:timer-outline
  timeout_motion_movie:
    name: Motion Timeout Movie
    min: 60
    max: 1800
    step: 60
    initial: 600
    unit_of_measurement: s
    icon: mdi:timer-outline
  transition_on:
    name: Light Transition On
    min: 0
    max: 5000
    step: 100
    initial: 800
    unit_of_measurement: ms
    icon: mdi:transition
  transition_off:
    name: Light Transition Off
    min: 0
    max: 10000
    step: 100
    initial: 3000
    unit_of_measurement: ms
    icon: mdi:transition
  zone_target_downstairs:
    name: Zone Target Temp Downstairs
    min: 60
    max: 85
    step: 0.5
    initial: 70
    unit_of_measurement: "°F"
    icon: mdi:thermometer
  zone_target_master:
    name: Zone Target Temp Master Bed
    min: 60
    max: 85
    step: 0.5
    initial: 70
    unit_of_measurement: "°F"
    icon: mdi:thermometer
  zone_target_family:
    name: Zone Target Temp Family Room
    min: 60
    max: 85
    step: 0.5
    initial: 70
    unit_of_measurement: "°F"
    icon: mdi:thermometer
