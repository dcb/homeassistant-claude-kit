front_door_snapshot:
  alias: AI Front Door Notification
  sequence:
  - action: ai_task.generate_data
    metadata: {}
    data:
      task_name: 'Update: Generate content from a prompt consisting of text and optionally
        images'
      instructions: 'Motion has been detected, compare and very briefly describe what
        you see in the following sequence of images from my front door camera. What
        do you think caused the motion alarm? If a person is present, describe them
        in detail. Do not describe cars, stationary objects, trees, bushes, or buildings.
        If you see no obvious causes of motion, reply with "No Obvious Motion Detected."
        Your message needs to be short enough to fit in a phone notification. '
      entity_id: ai_task.google_ai_task
      attachments:
        media_content_id: media-source://camera/camera.front_door_medium_resolution_channel
        media_content_type: application/vnd.apple.mpegurl
        metadata:
          title: Front Door Medium resolution channel
          thumbnail: /api/camera_proxy/camera.front_door_medium_resolution_channel
          media_class: video
          children_media_class:
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://camera
    response_variable: frontdoor_ai_description
  - if:
    - condition: template
      value_template: '{{ ''No Obvious Motion Detected.'' in frontdoor_ai_description.data
        }}'
    then:
    - stop: ''
    else:
    - action: input_text.set_value
      metadata: {}
      data:
        value: '{{ frontdoor_ai_description.data }}'
      target:
        entity_id: input_text.front_door_ai_description
    - action: notify.persistent_notification
      metadata: {}
      data:
        message: '<b>Front Door Motion Detected: {{ frontdoor_ai_description.data
          }}'
      enabled: false
    - action: notify.mobile_app_horis_iphone
      data:
        title: Front Door Motion Detected
        message: '{{ frontdoor_ai_description.data }}'
      enabled: false
    - condition: time
      after: 07:00:00
      before: '22:00:00'
      weekday:
      - sun
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
    - action: script.alert_template
      metadata: {}
      data:
        volume: 35
        delay:
          hours: 0
          minutes: 0
          seconds: 5
        speaker:
          entity_id: media_player.unnamed_room
          media_content_id: media-source://media_source/local/chime-small.mp3
          media_content_type: audio/mpeg
          metadata:
            title: chime-small.mp3
            thumbnail:
            media_class: music
            children_media_class:
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://media_source
        message: '{{ frontdoor_ai_description.data }}'
  mode: single
