alarm_script:
  alias: Alarm Script
  sequence:
  - alias: Generate unique ID
    variables:
      scene_id: '{{ slugify(this.context.id) }}'
  - alias: Save media player state
    data:
      scene_id: '{{ scene_id }}'
      snapshot_entities: '{{ speaker.entity_id }}'
    action: scene.create
  - alias: Set volume
    target:
      entity_id: '{{ speaker.entity_id }}'
    data:
      volume_level: '{{ volume | default(0.5) }}'
    action: media_player.volume_set
  - parallel:
    - alias: Play media
      target:
        entity_id: '{{ speaker.entity_id }}'
      data:
        media_content_id: '{{ speaker.media_content_id }}'
        media_content_type: '{{ speaker.media_content_type }}'
      action: media_player.play_media
    - alias: Wait for media to start playing
      wait_template: '{{ is_state(speaker.entity_id, ''playing'') }}'
      continue_on_timeout: true
      timeout: 00:00:30
  - variables:
      player_state: '{{ states(speaker.entity_id) }}'
  - alias: Wait until media is finished playing
    wait_template: '{{ not is_state(speaker.entity_id, ''playing'') }}'
    continue_on_timeout: true
    timeout: 00:00:30
  - parallel:
    - alias: Say something TTS
      action: media_player.play_media
      data:
        media_content_id: 'media-source://tts/tts.google_cloud?message="{{ message
          }}"

          '
        media_content_type: music
      target:
        entity_id: '{{ speaker.entity_id }}'
    - alias: Wait for media to start playing
      wait_template: '{{ is_state(speaker.entity_id, ''playing'') }}'
      continue_on_timeout: true
      timeout: 00:00:30
  - alias: Wait until media is finished playing
    wait_template: '{{ not is_state(speaker.entity_id, ''playing'') }}'
    continue_on_timeout: true
    timeout: 00:00:30
  - alias: Reset volume
    target:
      entity_id: '{{ speaker.entity_id }}'
    data:
      volume_level: 0.3
    action: media_player.volume_set
  - alias: Restore media player state
    target:
      entity_id: scene.{{ scene_id }}
    action: scene.turn_on
  - alias: Garbage collection
    target:
      entity_id: scene.{{ scene_id }}
    action: scene.delete
  icon: mdi:alarm
  fields:
    speaker:
      name: speaker
      selector:
        media: {}
      required: true
    volume:
      name: volume
      selector:
        number:
          min: 0
          max: 1
          step: 0.1
      default: 0.3
      required: false
    message:
      name: message
      selector:
        text: {}
      required: true
      default: Please replace with your alarm message
  mode: single
  description: ''
alert_template:
  alias: Alert Template
  sequence:
  - alias: Play media
    action: media_player.play_media
    target:
      entity_id: '{{ speaker.entity_id }}'
    data:
      announce: true
      extra:
        volume: '{{ volume | default(50) }}'
      media:
        media_content_id: '{{ speaker.media_content_id }}'
        media_content_type: '{{ speaker.media_content_type }}'
        metadata: {}
  - delay:
      hours: '{{ delay.hours }}'
      minutes: '{{ delay.minutes }}'
      seconds: '{{ delay.seconds }}'
      milliseconds: 0
  - alias: Say something TTS
    action: media_player.play_media
    target:
      entity_id: '{{ speaker.entity_id }}'
    data:
      announce: true
      extra:
        volume: '{{ volume | default(50) }}'
      media:
        media_content_id: 'media-source://tts/tts.google_cloud?message="{{ message
          }}"

          '
        media_content_type: music
        metadata: {}
  icon: mdi:alarm
  fields:
    speaker:
      name: speaker
      selector:
        media: {}
      required: true
    volume:
      name: volume
      selector:
        number:
          min: 1
          max: 100
          step: 1
      default: 50
      required: false
    message:
      name: message
      selector:
        text: {}
      required: true
      default: Please replace with your alarm message
    delay:
      selector:
        duration: {}
      name: delay
      description: delay between the alert media and TTS
      required: true
      default:
        hours: 0
        minutes: 0
        seconds: 5
  mode: single
  description: ''
