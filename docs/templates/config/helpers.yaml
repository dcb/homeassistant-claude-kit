###############################################################################
# helpers.yaml — All input_* helpers, timers, and counters
#
# Included from configuration.yaml via:
#   homeassistant:
#     packages:
#       helpers: !include helpers.yaml
#
# OR included directly as top-level keys if your configuration.yaml uses
# flat includes. Replace all your_* placeholders with meaningful names.
#
# IMPORTANT: Never hardcode values that belong here into automations.
# Always read helpers via states('input_number.your_x') etc.
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ DOMAIN SECTIONS                                                 │
# │                                                                 │
# │ Helpers are grouped by automation domain. Delete entire          │
# │ sections you don't use:                                         │
# │                                                                 │
# │ REQUIRED (core)  — activity modes, context, health monitoring   │
# │ LIGHTING         — timeouts, brightness, transitions, porch     │
# │ CLIMATE          — zones, temperatures, schedules, preheat, AC  │
# │ ENERGY/EV        — solar charging, EV modes, polling            │
# │ APPLIANCE        — dishwasher/washer state machine, reminders   │
# │ IRRIGATION       — zone scheduling, skip thresholds, run state   │
# │                                                                 │
# │ Within each HA domain type (input_boolean, input_number, etc.), │
# │ helpers are tagged with their domain in comments.               │
# └─────────────────────────────────────────────────────────────────┘
###############################################################################

input_boolean:
  # ── Activity modes [REQUIRED] ───────────────────────────────────────────────
  night_mode:
    name: Night Mode
    icon: mdi:weather-night

  movie_mode:
    name: Movie Mode
    icon: mdi:movie-open

  work_mode:
    name: Work Mode
    icon: mdi:desk

  work_mode_auto:
    name: Work Mode Auto
    icon: mdi:desk-lamp

  movie_mode_auto:
    name: Movie Mode Auto
    icon: mdi:movie-open-outline

  away_mode:
    name: Away Mode
    icon: mdi:home-export-outline

  # ── Climate zone overrides [CLIMATE] ─────────────────────────────────────────
  # Add one per zone: your_zone_NAME_override
  your_zone_living_room_override:
    name: Living Room Override
    icon: mdi:thermometer-lines

  your_zone_bedroom_override:
    name: Bedroom Override
    icon: mdi:thermometer-lines

  # ── AC manual mode [CLIMATE] ────────────────────────────────────────────────
  your_living_room_ac_manual:
    name: Living Room AC Manual Mode
    icon: mdi:air-conditioner

  your_bedroom_ac_manual:
    name: Bedroom AC Manual Mode
    icon: mdi:air-conditioner

  # ── EV charging [ENERGY/EV] ──────────────────────────────────────────────────
  your_ev_scheduled_charge_active:
    name: EV Scheduled Charge Active
    icon: mdi:calendar-check

  # ── Appliance [APPLIANCE] ────────────────────────────────────────────────────
  your_solar_reminded_today:
    name: Appliance Solar Reminded Today
    icon: mdi:solar-power

  # ── Irrigation [IRRIGATION] ──────────────────────────────────────────────────
  # Global controls + per-zone helpers. Per-zone helpers use the slug pattern
  # irrigation_zone_{slug}_* — duplicate the front_zone_1/back_zone_1 entries
  # for each real zone you add. Keep slugs in sync with automations/irrigation.yaml
  # and the dashboard's entities.ts IRRIGATION_ZONES.
  irrigation_enabled:
    name: Irrigation Enabled
    icon: mdi:water
  irrigation_heat_boost:
    name: Irrigation Heat Wave Boost
    icon: mdi:weather-sunny-alert
  irrigation_manual_stop:
    name: Irrigation Manual Stop
    icon: mdi:stop-circle
  irrigation_run_now:
    # Dashboard "Run now" button — triggers the daily scheduler on demand.
    name: Irrigation Run Now
    icon: mdi:play-circle-outline

  # Per-zone: enabled flag (include zone in scheduled runs)
  irrigation_zone_front_zone_1_enabled:
    name: Front Zone 1 - Enabled
    icon: mdi:sprinkler-variant
  irrigation_zone_back_zone_1_enabled:
    name: Back Zone 1 - Enabled
    icon: mdi:sprinkler-variant

  # Per-zone: manual-run trigger (dashboard single-zone Start button)
  irrigation_zone_front_zone_1_manual_run:
    name: Front Zone 1 - Manual Run
    icon: mdi:play-circle
  irrigation_zone_back_zone_1_manual_run:
    name: Back Zone 1 - Manual Run
    icon: mdi:play-circle

  # Per-zone: running sentinel — single source of truth for "this zone is part
  # of an active watering session (including soak between cycles)". The
  # automations set it at the top of each zone block and clear it at the bottom;
  # the dashboard reads it for the Start↔Stop flip and elapsed-time display.
  irrigation_zone_front_zone_1_running:
    name: Front Zone 1 - Running
    icon: mdi:sprinkler
  irrigation_zone_back_zone_1_running:
    name: Back Zone 1 - Running
    icon: mdi:sprinkler


input_select:
  # ── Climate mode [CLIMATE] ──────────────────────────────────────────────────
  your_climate_mode:
    name: Climate Mode
    options:
      - Winter
      - Winter-Eco
      - Spring-Autumn
      - Summer
      - Off
    icon: mdi:home-thermometer-outline

  # ── Preheat state [CLIMATE] ─────────────────────────────────────────────────
  your_preheat_mode:
    name: Preheat Mode
    options:
      - idle
      - schedule
      - away_return
    icon: mdi:sun-clock

  # ── EV charge mode [ENERGY/EV] ──────────────────────────────────────────────
  your_ev_charge_mode:
    name: EV Charge Mode
    options:
      - Solar
      - Fast
      - Manual
      - Off
    icon: mdi:ev-station

  # ── Solar priority [ENERGY/EV] ──────────────────────────────────────────────
  your_solar_priority:
    name: Solar Priority
    options:
      - Balanced
      - Charge First
      - Heat First
    icon: mdi:solar-power-variant

  # ── Appliance state [APPLIANCE] ──────────────────────────────────────────────
  # Persists independently of WiFi appliance sensors going unavailable
  your_appliance_state:
    name: Appliance State
    options:
      - dirty
      - running
      - clean
    icon: mdi:dishwasher

  # ── Irrigation [IRRIGATION] ──────────────────────────────────────────────────
  irrigation_frequency:
    name: Irrigation Frequency
    icon: mdi:calendar-refresh
    options:
      - daily
      - every_other_day
      - every_2_days
      - every_3_days
      - manual_only
  # Per-zone: front/back group membership (drives the daily rotation)
  irrigation_zone_front_zone_1_group:
    name: Front Zone 1 - Group
    icon: mdi:group
    options:
      - front
      - back
  irrigation_zone_back_zone_1_group:
    name: Back Zone 1 - Group
    icon: mdi:group
    options:
      - front
      - back


input_number:
  # ── Lighting timeouts (seconds) [LIGHTING] ──────────────────────────────────
  timeout_motion_normal:
    name: Motion Timeout Normal
    min: 10
    max: 600
    step: 5
    unit_of_measurement: s
    icon: mdi:timer-outline

  timeout_motion_night:
    name: Motion Timeout Night
    min: 5
    max: 120
    step: 5
    unit_of_measurement: s
    icon: mdi:timer-outline

  timeout_motion_movie:
    name: Motion Timeout Movie
    min: 5
    max: 120
    step: 5
    unit_of_measurement: s
    icon: mdi:timer-outline

  timeout_motion_normal_long:
    name: Motion Timeout Long
    min: 30
    max: 600
    step: 10
    unit_of_measurement: s
    icon: mdi:timer-outline

  # ── Lighting transitions (seconds) [LIGHTING] ───────────────────────────────
  transition_on:
    name: Light Transition On
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: s
    icon: mdi:transition

  transition_off:
    name: Light Transition Off
    min: 0
    max: 30
    step: 0.5
    unit_of_measurement: s
    icon: mdi:transition

  # ── Lighting brightness [LIGHTING] ───────────────────────────────────────────
  brightness_movie:
    name: Movie Mode Brightness
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-percent

  # ── Luminance thresholds [LIGHTING] ──────────────────────────────────────────
  luminance_threshold_room:
    name: Luminance Threshold (room)
    min: 0
    max: 1000
    step: 10
    unit_of_measurement: lx
    icon: mdi:brightness-5

  # ── Porch lights [LIGHTING] ──────────────────────────────────────────────────
  porch_lights_elevation_on:
    name: Porch Lights Sun Elevation On
    min: -18
    max: 5
    step: 0.5
    unit_of_measurement: "°"
    icon: mdi:weather-sunset

  # ── Work mode [LIGHTING] ─────────────────────────────────────────────────────
  your_work_color_temp:
    name: Work Mode Color Temp
    min: 2700
    max: 6500
    step: 100
    unit_of_measurement: K
    icon: mdi:temperature-kelvin

  # ── Climate temperatures [CLIMATE] ───────────────────────────────────────────
  your_target_temperature:
    name: Target Temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  your_target_temperature_day:
    name: Day Temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:weather-sunny

  your_target_temperature_night:
    name: Night Temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:weather-night

  # Add one per zone: your_zone_NAME_target
  your_zone_living_room_target:
    name: Living Room Target Temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  your_zone_bedroom_target:
    name: Bedroom Target Temperature
    min: 5
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  your_hysteresis_heat_on:
    name: Heating Hysteresis On
    min: 0
    max: 2
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up

  your_hysteresis_heat_off:
    name: Heating Hysteresis Off
    min: 0
    max: 2
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down

  your_boiler_min_cycle_minutes:
    name: Boiler Min Cycle Minutes
    min: 1
    max: 30
    step: 1
    unit_of_measurement: min
    icon: mdi:timer

  your_preheat_max_duration:
    name: Preheat Max Duration
    min: 15
    max: 180
    step: 15
    unit_of_measurement: min
    icon: mdi:timer

  # ── AC solar heating [CLIMATE] ───────────────────────────────────────────────
  your_ac_manual_mode_duration:
    name: AC Manual Mode Duration
    min: 1
    max: 24
    step: 1
    unit_of_measurement: h
    icon: mdi:timer

  # ── EV charging [ENERGY/EV] ───────────────────────────────────────────────────
  your_ev_charge_min_watts:
    name: EV Min Charge Watts
    min: 1380
    max: 11040
    step: 100
    unit_of_measurement: W
    icon: mdi:flash

  your_ev_charge_max_watts:
    name: EV Max Charge Watts
    min: 1380
    max: 22080
    step: 100
    unit_of_measurement: W
    icon: mdi:flash

  your_ev_charge_manual_watts:
    name: EV Manual Charge Watts
    min: 1380
    max: 22080
    step: 100
    unit_of_measurement: W
    icon: mdi:flash

  your_ev_charge_ramp_up_watts:
    name: EV Charge Ramp Up Step
    min: 100
    max: 2000
    step: 100
    unit_of_measurement: W
    icon: mdi:chevron-up

  your_ev_charge_import_buffer_watts:
    name: EV Charge Import Buffer
    min: 0
    max: 2000
    step: 100
    unit_of_measurement: W
    icon: mdi:buffer

  your_ev_charge_patience:
    name: EV Start Patience
    min: 1
    max: 10
    step: 1
    unit_of_measurement: ticks
    icon: mdi:timer-sand

  your_ev_charge_pause_patience:
    name: EV Pause Patience
    min: 1
    max: 10
    step: 1
    unit_of_measurement: ticks
    icon: mdi:timer-sand

  your_ev_charge_start_confidence:
    name: EV Start Confidence
    min: 0
    max: 20
    step: 1
    icon: mdi:counter

  your_ev_charge_pause_confidence:
    name: EV Pause Confidence
    min: 0
    max: 20
    step: 1
    icon: mdi:counter

  # ── Health monitoring [REQUIRED] ─────────────────────────────────────────────
  your_battery_threshold:
    name: Battery Alert Threshold
    min: 5
    max: 30
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-alert

  # ── Irrigation — global thresholds [IRRIGATION] ──────────────────────────────
  irrigation_pause_days:
    name: Irrigation Pause Days
    icon: mdi:pause-circle
    min: 0
    max: 30
    step: 1
  irrigation_rain_skip_mm:
    name: Irrigation Rain Skip Threshold
    icon: mdi:weather-rainy
    min: 0
    max: 50
    step: 1
    unit_of_measurement: "mm"
  irrigation_rain_history_skip_mm:
    name: Irrigation Rain History Skip
    icon: mdi:weather-pouring
    min: 0
    max: 50
    step: 1
    unit_of_measurement: "mm"
  irrigation_wind_skip_kmh:
    name: Irrigation Wind Skip Threshold
    icon: mdi:weather-windy
    min: 0
    max: 60
    step: 5
    unit_of_measurement: "km/h"
  irrigation_freeze_temp:
    name: Irrigation Freeze Skip
    icon: mdi:snowflake-alert
    min: 0
    max: 10
    step: 1
    unit_of_measurement: "°C"
  irrigation_seasonal_cold_temp:
    name: Irrigation Seasonal Cold Skip
    icon: mdi:thermometer-low
    min: 0
    max: 15
    step: 1
    unit_of_measurement: "°C"
  irrigation_start_time_hour:
    name: Irrigation Start Hour
    icon: mdi:clock-start
    min: 0
    max: 23
    step: 1
  irrigation_start_time_minute:
    name: Irrigation Start Minute
    icon: mdi:clock-start
    min: 0
    max: 59
    step: 1
  irrigation_end_hour:
    name: Irrigation End Hour
    icon: mdi:clock-end
    min: 0
    max: 23
    step: 1

  # ── Irrigation — per-zone settings [IRRIGATION] ──────────────────────────────
  # 4 helpers per zone: cycle_minutes / cycles / soak_minutes / seasonal_pct.
  # Effective per-cycle runtime = max(1, round(cycle_minutes × seasonal_pct/100)),
  # repeated `cycles` times with `soak_minutes` between cycles. Duplicate this
  # group for each zone, swapping the slug.
  #
  # Front Zone 1
  irrigation_zone_front_zone_1_cycle_minutes:
    name: Front Zone 1 - Cycle Duration
    icon: mdi:timer
    min: 0.5
    max: 60
    step: 0.5
    unit_of_measurement: "min"
  irrigation_zone_front_zone_1_cycles:
    name: Front Zone 1 - Cycles
    icon: mdi:repeat
    min: 1
    max: 5
    step: 1
  irrigation_zone_front_zone_1_soak_minutes:
    name: Front Zone 1 - Soak Duration
    icon: mdi:water-opacity
    min: 5
    max: 60
    step: 5
    unit_of_measurement: "min"
  irrigation_zone_front_zone_1_seasonal_pct:
    name: Front Zone 1 - Seasonal Adjustment
    icon: mdi:percent
    min: 10
    max: 200
    step: 5
    unit_of_measurement: "%"
  # Back Zone 1
  irrigation_zone_back_zone_1_cycle_minutes:
    name: Back Zone 1 - Cycle Duration
    icon: mdi:timer
    min: 0.5
    max: 60
    step: 0.5
    unit_of_measurement: "min"
  irrigation_zone_back_zone_1_cycles:
    name: Back Zone 1 - Cycles
    icon: mdi:repeat
    min: 1
    max: 5
    step: 1
  irrigation_zone_back_zone_1_soak_minutes:
    name: Back Zone 1 - Soak Duration
    icon: mdi:water-opacity
    min: 5
    max: 60
    step: 5
    unit_of_measurement: "min"
  irrigation_zone_back_zone_1_seasonal_pct:
    name: Back Zone 1 - Seasonal Adjustment
    icon: mdi:percent
    min: 10
    max: 200
    step: 5
    unit_of_measurement: "%"


input_datetime:
  # ── Climate schedules [CLIMATE] ──────────────────────────────────────────────
  your_morning_work_day:
    name: Morning (Work Day)
    has_time: true
    has_date: false

  your_morning_weekend:
    name: Morning (Weekend)
    has_time: true
    has_date: false

  your_night_time_work_day:
    name: Night Time (Work Day)
    has_time: true
    has_date: false

  your_night_time_weekend:
    name: Night Time (Weekend)
    has_time: true
    has_date: false

  your_last_boiler_command:
    name: Last Boiler Command
    has_time: true
    has_date: true

  # ── Irrigation [IRRIGATION] ──────────────────────────────────────────────────
  irrigation_last_run_date:
    name: Irrigation Last Run Date
    icon: mdi:calendar-check
    has_date: true
    has_time: true
  irrigation_pause_until:
    # Date-only. Set by the pause_days converter; the scheduler skips while
    # today < this date.
    name: Irrigation Pause Until
    icon: mdi:pause-circle
    has_date: true
    has_time: false


timer:
  # ── AC manual mode timers [CLIMATE] ──────────────────────────────────────────
  your_living_room_ac_timer:
    name: Living Room AC Manual Mode Timer

  your_bedroom_ac_timer:
    name: Bedroom AC Manual Mode Timer

  # ── Climate [CLIMATE] ────────────────────────────────────────────────────────
  your_preheat_timeout_timer:
    name: Preheat Safety Timeout

  # ── TV sleep timers [REQUIRED] ───────────────────────────────────────────────
  your_tv_sleep_timer_bedroom:
    name: TV Sleep Timer Bedroom

  your_tv_sleep_timer_living_room:
    name: TV Sleep Timer Living Room


counter:
  your_appliance_cycles_counter:
    name: Appliance Cycles
    step: 1
    icon: mdi:counter

  # ── Irrigation [IRRIGATION] ──────────────────────────────────────────────────
  # Consecutive days above the heat-wave temperature; drives heat boost.
  irrigation_hot_days:
    name: Irrigation Hot Days Counter
    icon: mdi:weather-sunny-alert
    step: 1
    minimum: 0
    maximum: 30
    restore: true


input_text:
  # ── Irrigation — internal run state [IRRIGATION] ─────────────────────────────
  # Written by the automations, read by the dashboard + morning report.
  irrigation_last_run_status:
    # completed / skipped / aborted / paused / hard_stopped / manually_stopped / running
    name: Irrigation Last Run Status
    icon: mdi:information
    max: 255
  irrigation_last_run_details:
    name: Irrigation Last Run Details
    icon: mdi:text
    max: 255
  irrigation_last_run_skipped_zones:
    # Comma-joined slugs of zones that failed mid-run (accumulated during a run).
    name: Irrigation Last Run Skipped Zones
    icon: mdi:alert-circle-outline
    max: 255
